<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1b19">
<title>Lift Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{--bg:#1c1b19;--card:#27251f;--line:#3a372f;--text:#f1ead9;--mute:#a39c8a;--acc:#e8b04a;--accA:#7fb685;--accB:#6fa3d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:max(14px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:6px 0 12px;letter-spacing:.2px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:none;color:var(--mute);border-radius:10px;font-size:15px}
.tab.on{background:var(--card);color:var(--text);border-color:var(--acc)}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.weeknav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px}
.weeknav .t{text-align:center}
.weeknav .t b{font-size:18px}
.weeknav .t small{display:block;color:var(--mute);margin-top:2px}
.sess{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.sess>header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.sess>header b{font-size:16px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;color:#111;font-weight:600}
.pill.A{background:var(--accA)}.pill.B{background:var(--accB)}
.ex{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .n{flex:1;min-width:0}
.ex .n div{font-size:15px;line-height:1.25}
.ex .n small{color:var(--mute);font-size:13px}
.ex input{width:84px;padding:10px 8px;font-size:17px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.ex input::placeholder{color:#6d6757}
.ex .u{color:var(--mute);font-size:13px;width:18px}
.hist{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;padding:12px 14px}
.hist h3{margin:0 0 8px;font-size:15px}
.hist .row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-top:1px solid var(--line)}
.hist .row:first-of-type{border-top:0}
.hist .row span:last-child{color:var(--acc)}
.empty{color:var(--mute);font-size:14px}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:8px}
.saved{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--mute);pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏋️ Lift Log</h1>
  <div class="tabs">
    <button class="tab on" id="tLog">Log</button>
    <button class="tab" id="tProg">Progress</button>
  </div>
  <div id="view"></div>
  <div class="note">Weights in kg · saved on this device</div>
</div>
<div class="saved" id="saved"></div>

<script>
const WORKOUTS = {
  A: [
    {n:"Goblet squat or leg press", s:"3 × 8–10"},
    {n:"Dumbbell or barbell bench press", s:"3 × 8–10"},
    {n:"Seated cable row or 1-arm DB row", s:"3 × 10"},
    {n:"Romanian deadlift (light)", s:"2 × 8"},
    {n:"Plank", s:"2 × 30 sec", bw:true}
  ],
  B: [
    {n:"Trap bar deadlift or DB RDL", s:"3 × 6–8"},
    {n:"Overhead dumbbell press", s:"3 × 8"},
    {n:"Lat pulldown (or assisted pull-up)", s:"3 × 10"},
    {n:"Split squat or step-up", s:"2 × 8 per leg"},
    {n:"Farmer's carry", s:"3 × 30–40 sec"}
  ]
};
// Week 1: A,B,A  ·  Week 2: B,A,B  ·  repeats
const WEEKS = 4;
const sessionsFor = w => (w % 2 === 1) ? ["A","B","A"] : ["B","A","B"];

let state = {week:1, log:{}};      // log["w-s-i"] = "weight"
let tab = "log";
const LS = "liftlog.v1";
let saveTimer = null;

function loadLocal(){ try{ const r = localStorage.getItem(LS); if(r) state = Object.assign(state, JSON.parse(r)); }catch(e){} if(state.week>4) state.week=4; if(state.week<1) state.week=1; }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function flash(t){ const el=document.getElementById("saved"); el.textContent=t; clearTimeout(flash.t); flash.t=setTimeout(()=>el.textContent="",1500); }

function persist(){
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>flash("Saved ✓"), 400);
}

function prevWeight(w, s, i, letter){
  // most recent earlier logged weight for the same workout letter + exercise
  for(let ww=w; ww>=1; ww--){
    const ss = sessionsFor(ww);
    for(let k=(ww===w? s-1 : 2); k>=0; k--){
      if(ss[k]===letter){
        const v = state.log[ww+"-"+k+"-"+i];
        if(v) return v;
      }
    }
  }
  return "";
}

function renderLog(){
  const w = state.week, ss = sessionsFor(w);
  let h = `<div class="weeknav"><button id="pw">‹</button><div class="t"><b>Week ${w} of ${WEEKS}</b><small>${ss.join(" · ")}</small></div><button id="nw" ${w>=WEEKS?"disabled style=\"opacity:.3\"":""}>›</button></div>`;
  ss.forEach((letter, s)=>{
    h += `<div class="sess"><header><b>Session ${s+1}</b><span class="pill ${letter}">Workout ${letter}</span></header>`;
    WORKOUTS[letter].forEach((ex,i)=>{
      const key = w+"-"+s+"-"+i;
      const val = state.log[key] || "";
      const ph = prevWeight(w,s,i,letter) || (ex.bw ? "BW" : "kg");
      h += `<div class="ex"><div class="n"><div>${ex.n}</div><small>${ex.s}</small></div>
        <input inputmode="decimal" data-k="${key}" value="${val}" placeholder="${ph}" aria-label="${ex.n} weight"><span class="u">kg</span></div>`;
    });
    h += `</div>`;
  });
  return h;
}

function renderProg(){
  let h = "";
  ["A","B"].forEach(letter=>{
    h += `<div class="hist"><h3><span class="pill ${letter}">Workout ${letter}</span></h3>`;
    WORKOUTS[letter].forEach((ex,i)=>{
      const rows = [];
      const maxW = WEEKS;
      for(let w=1; w<=maxW; w++){
        sessionsFor(w).forEach((l,s)=>{
          if(l!==letter) return;
          const v = state.log[w+"-"+s+"-"+i];
          if(v) rows.push([w,v]);
        });
      }
      h += `<div style="margin:10px 0 4px;font-size:14px">${ex.n}</div>`;
      if(!rows.length) h += `<div class="empty">No entries yet</div>`;
      else rows.slice(-6).forEach(r=> h += `<div class="row"><span>Week ${r[0]}</span><span>${r[1]} kg</span></div>`);
    });
    h += `</div>`;
  });
  return h;
}

function render(){
  const v = document.getElementById("view");
  v.innerHTML = tab==="log" ? renderLog() : renderProg();
  document.getElementById("tLog").classList.toggle("on", tab==="log");
  document.getElementById("tProg").classList.toggle("on", tab==="prog");
  if(tab==="log"){
    document.getElementById("pw").onclick = ()=>{ if(state.week>1){ state.week--; persist(); render(); } };
    document.getElementById("nw").onclick = ()=>{ if(state.week>=WEEKS) return; state.week++; persist(); render(); };
    v.querySelectorAll("input[data-k]").forEach(inp=>{
      inp.addEventListener("input", ()=>{
        const k = inp.dataset.k, val = inp.value.replace(",",".").trim();
        if(val) state.log[k] = val; else delete state.log[k];
        persist();
      });
    });
  }
}

document.getElementById("tLog").onclick = ()=>{ tab="log"; render(); };
document.getElementById("tProg").onclick = ()=>{ tab="prog"; render(); };

loadLocal();
render();
</script>
</body>
</html>
